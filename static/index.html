<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>每日提醒 Agent</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <h1>每日提醒 Agent</h1>

        <!-- 登录/注册区域 -->
        <div id="auth-section">
            <input id="username" type="text" placeholder="用户名" autocomplete="username">
            <input id="password" type="password" placeholder="密码" autocomplete="current-password">
            <input id="email" type="email" placeholder="邮箱（仅注册需要）" autocomplete="email">
            <div class="button-group">
                <button id="btn-login">登录</button>
                <button id="btn-register">注册</button>
            </div>
            <p id="auth-message"></p>
            <p style="margin-top: 12px; font-size: 13px;">
                <a href="#" id="btn-forgot" style="color: #4a90e2;">忘记密码？</a>
            </p>
        </div>

        <!-- 忘记密码区域 -->
        <div id="forgot-section" style="display: none;">
            <h2 style="font-size: 18px; margin-bottom: 12px;">找回密码</h2>
            <input id="forgot-email" type="email" placeholder="请输入注册时的邮箱">
            <div class="button-group">
                <button id="btn-send-reset">发送重置邮件</button>
                <button id="btn-back-login" style="background: #999;">返回登录</button>
            </div>
            <p id="forgot-message"></p>
        </div>

        <!-- 聊天区域 -->
        <div id="chat-section" style="display: none;">
            <div id="verify-banner" style="display: none;">
                ⚠️ 请先验证邮箱才能使用聊天功能，<a href="#" id="btn-send-verify">点此发送验证邮件</a>
            </div>
            <div id="messages"></div>
            <div class="input-row">
                <input id="chat-input" type="text" placeholder="说点什么...">
                <button id="btn-send">发送</button>
            </div>
            <div class="button-group" style="margin-top: 12px;">
                <button id="btn-logout" class="logout">退出登录</button>
                <button id="btn-delete-account" style="background: #d33;">注销账号</button>
            </div>
        </div>
    </div>
    <script src="/static/app.js"></script>
</body>
</html>
